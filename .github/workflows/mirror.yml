name: Mirror to inkioweb

on:
  push:
    branches:
      - main

jobs:
  git-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: yesolutions/mirror-action@master
        with:
          REMOTE: "https://github.com/inkioweb/inkio-web-agency.git"
          GIT_USERNAME: EbunoluwaArimoro
          GIT_PASSWORD: ${{ secrets.SYNC_TOKEN }}
